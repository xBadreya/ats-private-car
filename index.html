<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>ATS Ajman - Private Car Exit</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #061a2d;
      color: white;
      text-align: center;
    }

    #home {
      min-height: 100vh;
      padding: 25px;
    }

    h1 {
      font-size: 38px;
      margin: 15px 0 5px;
    }

    .subtitle {
      font-size: 21px;
      margin-bottom: 20px;
    }

    .gate {
      margin: 15px;
      font-size: 20px;
    }

    select {
      font-size: 20px;
      padding: 10px;
      border-radius: 10px;
    }

    #reader {
      max-width: 650px;
      margin: 20px auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
    }

    #startButton {
      background: #1687ff;
      color: white;
      border: none;
      padding: 16px 30px;
      border-radius: 14px;
      font-size: 22px;
      font-weight: bold;
      margin: 20px;
    }

    #message {
      font-size: 18px;
      margin: 15px;
    }

    #manualArea {
      margin-top: 20px;
    }

    input {
      font-size: 21px;
      padding: 14px;
      width: 250px;
      border-radius: 12px;
      border: none;
      text-align: center;
    }

    .check {
      font-size: 20px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      margin-left: 5px;
      font-weight: bold;
    }

    /* RESULT */

    #result {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;

      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .allowed { background: #07843b; }
    .bus { background: #c71919; }
    .duplicate { background: #e48100; }
    .unknown { background: #333; }

    #photo {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 20px;
      border: 7px solid white;
      display: none;
      margin-bottom: 15px;
    }

    #resultTitle {
      font-size: 48px;
      font-weight: 900;
    }

    #studentName {
      font-size: 34px;
      font-weight: bold;
      margin: 12px;
    }

    #details {
      font-size: 23px;
      line-height: 1.6;
    }

    .status {
      font-size: 32px;
      font-weight: 900;
      margin-top: 15px;
    }

    #next {
      margin-top: 25px;
      padding: 15px 30px;
      font-size: 21px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
    }
  </style>
</head>

<body>

<div id="home">

  <h1>ATS – AJMAN</h1>

  <div class="subtitle">
    Private Car Exit Verification
  </div>

  <div class="gate">
    Gate:

    <select id="gate">
      <option value="Gate 1">Gate 1</option>
      <option value="Gate 2">Gate 2</option>
    </select>
  </div>

  <button id="startButton" onclick="startCamera()">
    📷 START CAMERA
  </button>

  <div id="message">
    Tap START CAMERA to begin scanning
  </div>

  <div id="reader"></div>

  <div id="manualArea">

    <input id="studentID"
           inputmode="numeric"
           placeholder="Student ID">

    <button class="check" onclick="manualCheck()">
      CHECK
    </button>

  </div>

</div>


<div id="result">

  <img id="photo">

  <div id="resultTitle"></div>

  <div id="studentName"></div>

  <div id="details"></div>

  <button id="next" onclick="resetSystem()">
    NEXT STUDENT
  </button>

</div>


<script>

/* ==========================================
   IMPORTANT SETTINGS
========================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwjnfAjtmlrLK9i-n9dnelQWO5mmZvbnCdSN6-p22RXl9JCglr0ERvJKt4lsoSw3aCXOg/exec";

const API_KEY =
  "AJM-PC-8kR92xM4-2026-X7Q";


let qrScanner = null;
let processing = false;
let timer = null;


/* ==========================================
   START CAMERA
========================================== */

async function startCamera() {

  const button =
    document.getElementById("startButton");

  const message =
    document.getElementById("message");

  button.disabled = true;

  message.textContent =
    "Starting camera...";


  try {

    qrScanner =
      new Html5Qrcode("reader");


    await qrScanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 12,

        qrbox: {
          width: 280,
          height: 280
        }
      },

      qrSuccess,

      function() {
        // Ignore normal scanning errors
      }

    );


    button.style.display =
      "none";

    message.textContent =
      "Ready — scan student QR code";


  } catch(error) {

    console.error(error);

    button.disabled = false;

    button.textContent =
      "📷 TRY CAMERA AGAIN";

    message.innerHTML =
      "<b>Unable to open camera.</b><br>" +
      error.message;

  }

}


/* ==========================================
   QR DETECTED
========================================== */

function qrSuccess(decodedText) {

  if (processing) return;

  const id =
    String(decodedText)
      .trim()
      .split(/\s+/)[0];

  if (!id) return;

  processing = true;

  checkStudent(id);

}


/* ==========================================
   MANUAL TEST
========================================== */

function manualCheck() {

  if (processing) return;

  const id =
    document
      .getElementById("studentID")
      .value
      .trim();

  if (!id) return;

  processing = true;

  checkStudent(id);

}


/* ==========================================
   CHECK STUDENT
========================================== */

async function checkStudent(studentId) {

  const gate =
    document
      .getElementById("gate")
      .value;


  document.getElementById("message")
    .textContent =
    "Checking student...";


  const url =
    API_URL +
    "?action=check" +
    "&studentId=" +
    encodeURIComponent(studentId) +
    "&gate=" +
    encodeURIComponent(gate) +
    "&key=" +
    encodeURIComponent(API_KEY);


  try {

    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Server response: " +
        response.status
      );

    }


    const data =
      await response.json();


    showResult(data);


  } catch(error) {

    console.error(error);

    document.getElementById("message")
      .innerHTML =
      "<b>Connection Error</b><br>" +
      error.message;

    processing = false;

  }

}


/* ==========================================
   SHOW RESULT
========================================== */

function showResult(data) {

  const result =
    document.getElementById("result");

  const title =
    document.getElementById("resultTitle");

  const name =
    document.getElementById("studentName");

  const details =
    document.getElementById("details");

  const photo =
    document.getElementById("photo");


  result.className = "";

  photo.style.display = "none";


  if (
    data.student &&
    data.student.photo
  ) {

    photo.src =
      data.student.photo;

    photo.style.display =
      "block";
  }


  /* GREEN */

  if (data.status === "ALLOWED") {

    result.classList.add("allowed");

    title.textContent =
      "✓ EXIT ALLOWED";

    name.textContent =
      data.student.name;

    details.innerHTML =

      "Student ID: " +
      safe(data.student.id) +

      "<br>Class: " +
      safe(data.student.className) +

      "<br>School: " +
      safe(data.student.school) +

      '<div class="status">' +
      "🚗 PRIVATE CAR" +
      "</div>" +

      "<br>Exit Time: " +
      safe(data.exitTime) +

      "<br>" +
      safe(data.gate);

  }


  /* RED */

  else if (data.status === "BUS") {

    result.classList.add("bus");

    title.textContent =
      "✕ BUS STUDENT";

    name.textContent =
      data.student.name;

    details.innerHTML =

      "Student ID: " +
      safe(data.student.id) +

      "<br>Class: " +
      safe(data.student.className) +

      "<br>School: " +
      safe(data.student.school) +

      '<div class="status">' +
      "🚌 EXIT NOT ALLOWED" +
      "</div>";

  }


  /* ORANGE */

  else if (
    data.status === "ALREADY_USED"
  ) {

    result.classList.add("duplicate");

    title.textContent =
      "⚠ ALREADY EXITED";

    name.textContent =
      data.student.name;

    details.innerHTML =

      "Student ID: " +
      safe(data.student.id) +

      "<br>Class: " +
      safe(data.student.className) +

      "<br><br>Previous Exit: <b>" +
      safe(data.previousTime) +
      "</b>" +

      "<br>" +
      safe(data.previousGate);

  }


  /* NOT FOUND */

  else {

    result.classList.add("unknown");

    title.textContent =
      "STUDENT NOT FOUND";

    name.textContent =
      data.id || "";

    details.innerHTML =
      '<div class="status">' +
      "Please check Student ID" +
      "</div>";

  }


  result.style.display =
    "flex";


  /*
    Automatically return after
    5 seconds.
  */

  clearTimeout(timer);

  timer =
    setTimeout(
      resetSystem,
      5000
    );

}


/* ==========================================
   RESET
========================================== */

function resetSystem() {

  clearTimeout(timer);

  document.getElementById("result")
    .style.display =
    "none";

  document.getElementById("studentID")
    .value =
    "";

  document.getElementById("message")
    .textContent =
    "Ready — scan student QR code";

  processing = false;

}


/* ==========================================
   SAFE TEXT
========================================== */

function safe(value) {

  return String(
    value == null ? "" : value
  )

  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
