<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>ATS Ajman - Private Car Exit</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #061a2d;
  color: white;
}

body {
  text-align: center;
}

#home {
  min-height: 100vh;
  padding: 15px;
}

.title {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 3px;
  margin-top: 8px;
}

.subtitle {
  font-size: 20px;
  margin: 5px 0 12px;
}

.gateArea {
  font-size: 18px;
  margin: 8px;
}

select {
  font-size: 18px;
  padding: 8px 15px;
  border: 0;
  border-radius: 10px;
}


/* CAMERA */

#cameraContainer {
  position: relative;
  width: 100%;
  max-width: 650px;
  margin: 10px auto;
}

#reader {
  width: 100%;
  min-height: 350px;
  background: #000;
  border-radius: 18px;
  overflow: hidden;
}

#reader video {
  object-fit: cover !important;
}


/* START */

#startButton {
  padding: 15px 30px;
  margin: 15px;

  font-size: 21px;
  font-weight: bold;

  border: 0;
  border-radius: 14px;

  background: #1687ff;
  color: white;
}


/* STATUS */

#message {
  font-size: 17px;
  font-weight: bold;
  margin: 8px;
  min-height: 22px;
}


/* MANUAL */

#manualArea {
  margin-top: 12px;
}

#studentID {
  width: 240px;
  padding: 12px;

  font-size: 20px;

  border: 0;
  border-radius: 11px;

  text-align: center;
}

#checkButton {
  padding: 12px 18px;

  font-size: 19px;
  font-weight: bold;

  border: 0;
  border-radius: 11px;

  margin-left: 4px;
}


/* ========================================
   RESULT
======================================== */

#result {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 99999;

  width: 100vw;
  height: 100vh;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 20px;
}


.allowed {
  background: #07843b;
}

.bus {
  background: #c71919;
}

.duplicate {
  background: #e48100;
}

.unknown {
  background: #333333;
}


/* PHOTO */

#photo {

  width: 210px;
  height: 210px;

  object-fit: cover;

  border-radius: 20px;

  border: 6px solid white;

  background: white;

  display: none;

  margin-bottom: 10px;
}


/* RESULT TEXT */

#resultTitle {

  font-size: 48px;

  font-weight: 900;

  margin: 5px;
}


#studentName {

  font-size: 34px;

  font-weight: 800;

  margin: 7px;
}


#details {

  font-size: 22px;

  line-height: 1.45;
}


.bigStatus {

  font-size: 31px;

  font-weight: 900;

  margin-top: 10px;
}


#nextButton {

  margin-top: 17px;

  padding: 13px 30px;

  font-size: 20px;

  font-weight: bold;

  border: 0;

  border-radius: 13px;

  background: white;

  color: #111;
}


#countdown {

  margin-top: 8px;

  font-size: 16px;
}


/* iPad */

@media(max-width:800px) {

  .title {
    font-size: 32px;
  }

  #resultTitle {
    font-size: 42px;
  }

  #studentName {
    font-size: 30px;
  }

  #photo {
    width: 190px;
    height: 190px;
  }

}

</style>

</head>


<body>


<div id="home">

  <div class="title">
    ATS – AJMAN
  </div>

  <div class="subtitle">
    Private Car Exit Verification
  </div>


  <div class="gateArea">

    Gate:

    <select id="gate">

      <option value="Gate 1">
        Gate 1
      </option>

      <option value="Gate 2">
        Gate 2
      </option>

    </select>

  </div>


  <button
    id="startButton"
    onclick="startCamera()">

    📷 START CAMERA

  </button>


  <div id="message">

    Tap START CAMERA

  </div>


  <div id="cameraContainer">

    <div id="reader"></div>

  </div>


  <div id="manualArea">

    <input
      id="studentID"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Student ID">


    <button
      id="checkButton"
      onclick="manualCheck()">

      CHECK

    </button>

  </div>

</div>



<!-- RESULT -->

<div id="result">


  <img
    id="photo"
    alt="Student Photo">


  <div id="resultTitle"></div>


  <div id="studentName"></div>


  <div id="details"></div>


  <button
    id="nextButton"
    onclick="resetSystem()">

    NEXT STUDENT

  </button>


  <div id="countdown"></div>

</div>



<script>

/* ========================================
   SETTINGS
======================================== */


/*
  Use your EXISTING Apps Script /exec URL
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwjnfAjtmlrLK9i-n9dnelQWO5mmZvbnCdSN6-p22RXl9JCglr0ERvJKt4lsoSw3aCXOg/exec";


/*
  Use the SAME API key from Code.gs
*/

const API_KEY =
  "AJM-PC-8kR92xM4-2026-X7Q";


/*
  2 seconds = fast gate operation.
*/

const RESULT_SECONDS = 2;


let qrScanner = null;

let cameraStarted = false;

let processing = false;

let resetTimer = null;

let countdownTimer = null;


/*
  Prevent the exact same QR from firing
  repeatedly while still in camera view.
*/

let lastScannedID = "";

let lastScanTime = 0;



/* ========================================
   CAMERA
======================================== */

async function startCamera() {


  if (cameraStarted) {
    return;
  }


  const button =
    document.getElementById(
      "startButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  button.disabled = true;

  message.textContent =
    "Starting camera...";


  try {


    qrScanner =
      new Html5Qrcode(
        "reader"
      );


    /*
      Get available cameras.
    */

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera found."
      );
    }


    /*
      On iPad we prefer the rear camera.
      Usually the last camera is rear.
    */

    let cameraId =
      cameras[cameras.length - 1].id;


    /*
      Try to identify rear/back/environment
      camera by label.
    */

    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label || ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        cameraId =
          cameras[i].id;

        break;
      }

    }


    await qrScanner.start(

      cameraId,

      {

        /*
          Faster QR detection
        */

        fps: 20,


        /*
          Large scan area.
        */

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.85
              );


            return {

              width: size,
              height: size

            };

          },


        /*
          Helpful on mobile.
        */

        aspectRatio: 1.0,

        disableFlip: true

      },


      qrSuccess,


      function() {

        /*
          Ignore normal
          "QR not found" frames.
        */

      }

    );


    cameraStarted = true;


    button.style.display =
      "none";


    message.textContent =
      "READY — Scan QR";


  }

  catch(error) {


    console.error(error);


    button.disabled =
      false;


    button.textContent =
      "📷 TRY CAMERA AGAIN";


    message.innerHTML =
      "<b>Camera Error</b><br>" +
      safe(error.message);

  }

}



/* ========================================
   QR SUCCESS
======================================== */

function qrSuccess(
  decodedText
) {


  if (processing) {
    return;
  }


  let studentId =
    String(decodedText)
      .trim();


  /*
    QR should contain Student ID.
  */

  studentId =
    studentId
      .split(/\s+/)[0];


  if (!studentId) {
    return;
  }


  /*
    Stop the same QR repeatedly firing
    within 3 seconds.
  */

  const now =
    Date.now();


  if (
    studentId === lastScannedID &&
    now - lastScanTime < 3000
  ) {

    return;
  }


  lastScannedID =
    studentId;


  lastScanTime =
    now;


  processing = true;


  /*
    Show immediate feedback BEFORE
    waiting for Google.
  */

  document
    .getElementById("message")
    .textContent =
    "Checking " +
    studentId +
    "...";


  checkStudent(
    studentId
  );

}



/* ========================================
   MANUAL
======================================== */

function manualCheck() {


  if (processing) {
    return;
  }


  const input =
    document.getElementById(
      "studentID"
    );


  const studentId =
    input.value.trim();


  if (!studentId) {
    return;
  }


  processing = true;


  checkStudent(
    studentId
  );

}


document
  .getElementById("studentID")
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key ===
        "Enter"
      ) {

        manualCheck();

      }

    }
  );



/* ========================================
   API
======================================== */

async function checkStudent(
  studentId
) {


  const gate =
    document
      .getElementById("gate")
      .value;


  const url =

    API_URL +

    "?action=check" +

    "&studentId=" +
    encodeURIComponent(
      studentId
    ) +

    "&gate=" +
    encodeURIComponent(
      gate
    ) +

    "&key=" +
    encodeURIComponent(
      API_KEY
    ) +

    /*
      Prevent browser caching.
    */

    "&t=" +
    Date.now();


  try {


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Server " +
        response.status
      );

    }


    const data =
      await response.json();


    showResult(
      data
    );

  }

  catch(error) {


    console.error(error);


    document
      .getElementById("message")
      .innerHTML =

      "<b>Connection Error</b><br>" +

      safe(
        error.message
      );


    processing =
      false;

  }

}



/* ========================================
   RESULT
======================================== */

function showResult(data) {


  const result =
    document.getElementById(
      "result"
    );


  const title =
    document.getElementById(
      "resultTitle"
    );


  const name =
    document.getElementById(
      "studentName"
    );


  const details =
    document.getElementById(
      "details"
    );


  const photo =
    document.getElementById(
      "photo"
    );


  result.className =
    "";


  photo.style.display =
    "none";


  photo.removeAttribute(
    "src"
  );


  /*
    Start photo loading immediately.
  */

  if (
    data.student &&
    data.student.photo
  ) {


    photo.onload =
      function() {

        photo.style.display =
          "block";

      };


    photo.src =
      data.student.photo;

  }



  /* ======================================
     GREEN
  ====================================== */

  if (
    data.status ===
    "ALLOWED"
  ) {


    result.classList.add(
      "allowed"
    );


    title.textContent =
      "✓ EXIT ALLOWED";


    name.textContent =
      data.student.name;


    details.innerHTML =

      "Student ID: " +
      safe(
        data.student.id
      ) +

      "<br>" +

      "Class: " +
      safe(
        data.student.className
      ) +

      "<br>" +

      "School: " +
      safe(
        data.student.school
      ) +

      '<div class="bigStatus">' +

      "🚗 PRIVATE CAR" +

      "</div>" +

      "Exit: " +
      safe(
        data.exitTime
      ) +

      " — " +

      safe(
        data.gate
      );

  }



  /* ======================================
     RED
  ====================================== */

  else if (
    data.status ===
    "BUS"
  ) {


    result.classList.add(
      "bus"
    );


    title.textContent =
      "✕ BUS STUDENT";


    name.textContent =
      data.student.name;


    details.innerHTML =

      "Student ID: " +
      safe(
        data.student.id
      ) +

      "<br>" +

      "Class: " +
      safe(
        data.student.className
      ) +

      "<br>" +

      "School: " +
      safe(
        data.student.school
      ) +

      '<div class="bigStatus">' +

      "🚌 EXIT NOT ALLOWED" +

      "</div>";

  }



  /* ======================================
     ORANGE
  ====================================== */

  else if (
    data.status ===
    "ALREADY_USED"
  ) {


    result.classList.add(
      "duplicate"
    );


    title.textContent =
      "⚠ ALREADY EXITED";


    name.textContent =
      data.student.name;


    details.innerHTML =

      "Student ID: " +
      safe(
        data.student.id
      ) +

      "<br>" +

      "Class: " +
      safe(
        data.student.className
      ) +

      '<div class="bigStatus">' +

      "Previous Exit: " +

      safe(
        data.previousTime
      ) +

      "</div>" +

      safe(
        data.previousGate
      );

  }



  /* ======================================
     UNKNOWN
  ====================================== */

  else {


    result.classList.add(
      "unknown"
    );


    title.textContent =
      "STUDENT NOT FOUND";


    name.textContent =
      data.id || "";


    details.innerHTML =

      '<div class="bigStatus">' +

      "CHECK STUDENT ID" +

      "</div>";

  }



  /*
    Show status immediately.
  */

  result.style.display =
    "flex";


  startCountdown();

}



/* ========================================
   FAST RESET
======================================== */

function startCountdown() {


  clearTimeout(
    resetTimer
  );


  clearInterval(
    countdownTimer
  );


  let seconds =
    RESULT_SECONDS;


  const countdown =
    document.getElementById(
      "countdown"
    );


  countdown.textContent =
    "Next student in " +
    seconds;


  countdownTimer =
    setInterval(
      function() {


        seconds--;


        if (
          seconds > 0
        ) {


          countdown.textContent =
            "Next student in " +
            seconds;


        }

        else {


          clearInterval(
            countdownTimer
          );


          countdown.textContent =
            "";

        }

      },

      1000
    );


  resetTimer =
    setTimeout(
      resetSystem,
      RESULT_SECONDS *
      1000
    );

}



/* ========================================
   READY FOR NEXT STUDENT
======================================== */

function resetSystem() {


  clearTimeout(
    resetTimer
  );


  clearInterval(
    countdownTimer
  );


  document
    .getElementById("result")
    .style.display =
    "none";


  document
    .getElementById("studentID")
    .value =
    "";


  document
    .getElementById("message")
    .textContent =
    "READY — Scan QR";


  /*
    Camera NEVER stopped.
    Immediately ready for next QR.
  */

  processing =
    false;

}



/* ========================================
   SAFE HTML
======================================== */

function safe(value) {


  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>

</html>
